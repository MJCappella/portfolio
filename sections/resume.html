<!-- Resume Section (Redesigned with Modern Tabs for Experience, Skills, and Education) -->
<section class="section" id="resume">
    <div class="container">
        <div class="text-center mb-5">
            <h2 class="mb-2"><span class="text-danger">Experience</span> &amp; Expertise</h2>
            <p class="text-muted">Explore my professional background, engineering skills, and academic foundations</p>
        </div>

        <!-- Navigation Tabs -->
        <div class="resume-tabs-nav">
            <button class="resume-tab-btn active" data-target="#tab-experience">
                <i class="ti-briefcase"></i> Work Experience
            </button>
            <button class="resume-tab-btn" data-target="#tab-skills">
                <i class="ti-layers-alt"></i> Technical Skills
            </button>
            <button class="resume-tab-btn" data-target="#tab-education">
                <i class="ti-book"></i> Education &amp; Research
            </button>
        </div>

        <!-- Tab Contents loaded from separated section files -->
        <div class="resume-tabs-content">
            <!-- Experience Tab Pane -->
            <div class="resume-tab-pane" id="tab-experience" style="display: block;" data-include="sections/experience.html"></div>

            <!-- Skills Tab Pane -->
            <div class="resume-tab-pane" id="tab-skills" style="display: none;" data-include="sections/skills.html"></div>

            <!-- Education Tab Pane -->
            <div class="resume-tab-pane" id="tab-education" style="display: none;" data-include="sections/education.html"></div>
        </div>
    </div>
</section>
